name: python-tests

# Runs the tests of the Python pipeline (src/rs_py) with a coverage report on every
# push and pull request. The job fails if a test fails or if coverage drops below the
# floor set in --cov-fail-under; raise the floor as tests are added.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas scikit-learn pytest pytest-cov
      - name: Run the rs_py tests with coverage
        # From the repository root, because rs_py is imported as src.rs_py.
        # Coverage settings (what is measured, what is omitted) are in .coveragerc.
        run: python -m pytest src/rs_py/tests --cov --cov-report=term-missing --cov-fail-under=25
