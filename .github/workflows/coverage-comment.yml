name: coverage-comment

# Posts the coverage comment on pull requests from forks, after python-tests has run.
# It never checks out or runs the pull request's code: it only downloads the comment that
# python-tests stored as an artifact, and posts it.
on: # zizmor: ignore[dangerous-triggers] see the comment above
  workflow_run:
    workflows: ["python-tests"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write # post the comment, and edit it on later runs
      actions: read # download the comment artifact from the python-tests run
      contents: read
    steps:
      # Do not add actions/checkout here (security: the pull request code is untrusted).
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
