name: docs-deploy
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out perceptual_space_geometry
        # The rs_* modules call psg_* functions from this repository, so the demo
        # capture step needs it. run_all.m finds it at this path automatically.
        uses: actions/checkout@v4
        with:
          repository: jvlab/perceptual_space_geometry
          path: perceptual_space_geometry
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-autolinks-plugin mkdocs-material-extensions mkdocstrings-matlab mkdocstrings-python
      - name: Build demo capture specs
        run: python docs/build_demo_specs.py
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
      - name: Capture demo output and figures
        uses: matlab-actions/run-command@v3
        timeout-minutes: 20
        with:
          command: addpath('capture/matlab'); run_all('build/capture')
      - run: mkdocs build
      - run: mkdocs gh-deploy --force
