name: docs-deploy
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out perceptual_space_geometry
        # The rs_* modules call psg_* functions from this repository, so the demo
        # capture step needs it. run_all.m finds it at this path automatically.
        uses: actions/checkout@v4
        with:
          repository: jvlab/perceptual_space_geometry
          path: perceptual_space_geometry
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-autolinks-plugin mkdocs-material-extensions mkdocstrings-matlab mkdocstrings-python
      - name: Build demo capture specs
        run: python docs/build_demo_specs.py
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # Only base MATLAB is installed unless products are listed. The demos need
          # this toolbox (procrustes, regress); without it they stop with "Undefined
          # function" while the capture step still passes.
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Capture demo output and figures
        uses: matlab-actions/run-command@v3
        timeout-minutes: 20
        with:
          command: addpath('capture/matlab'); run_all('build/capture')
      - run: mkdocs build
      - name: Hand the built site to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  publish:
    # Serialized with every other write to gh-pages; see the publish job in
    # docs-build.yml for why the group is shared and why it uses queue: max.
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Configure Git Credentials
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Publish to gh-pages, preserving branch previews
        # Not "mkdocs gh-deploy": that rewrites the whole gh-pages tree, which
        # would delete preview/ and take down the previews of every branch whose
        # pull request is still open. This replaces the production site at the
        # root, so pages deleted from the docs really disappear, while leaving
        # preview/ untouched.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages-out
          cd gh-pages-out
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
          cp -a ../site/. .
          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            echo "site unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "docs for ${GITHUB_SHA}"
          git push origin gh-pages
