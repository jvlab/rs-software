name: docs-build
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-autolinks-plugin mkdocs-material-extensions mkdocstrings-matlab mkdocstrings-python pytest
      - name: Check the documentation helpers and the committed demo captures
        # Demos are captured locally, because they need MATLAB, and their
        # pages and figures are committed. test_demo_captures_current.py is
        # what stops a demo being edited without a fresh capture. Scoped to
        # docs/ because src/rs_py has a failing test unrelated to the docs.
        run: python -m pytest docs
      - run: mkdocs build
