name: docs-build
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: write   # branch pushes publish a preview into the gh-pages branch

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      preview_slug: ${{ steps.preview.outputs.slug }}
      site_url: ${{ steps.preview.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out perceptual_space_geometry
        # The rs_* modules call psg_* functions from this repository, so the demo
        # capture step needs it. run_all.m finds it at this path automatically.
        uses: actions/checkout@v4
        with:
          repository: jvlab/perceptual_space_geometry
          path: perceptual_space_geometry
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-autolinks-plugin mkdocs-material-extensions mkdocstrings-matlab mkdocstrings-python
      - name: Build demo capture specs
        run: python docs/build_demo_specs.py
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
      - name: Capture demo output and figures
        uses: matlab-actions/run-command@v3
        timeout-minutes: 20
        with:
          command: addpath('capture/matlab'); run_all('build/capture')
      - name: Work out where a branch preview will live
        # Only pushes publish. A pull_request build just checks that the site
        # compiles, and keeps the production site_url so links are checked as
        # they will really be.
        id: preview
        if: github.event_name == 'push'
        run: |
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')
          site_url="https://jvlab.github.io/rs-software/preview/$slug/"
          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

      - run: mkdocs build

      - name: Hand the built site to the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  publish:
    # Separate from build so that only the write to gh-pages is serialized. Every
    # workflow that writes to that branch (docs-build, docs-deploy,
    # docs-preview-cleanup) does it in a job in the gh-pages-write group, so they
    # queue behind each other instead of racing, while the slow builds still run in
    # parallel. queue: max keeps every waiting write; with the default, a newly
    # queued job cancels the one already pending, and that write would be lost.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-write
      queue: max
    env:
      PREVIEW_SLUG: ${{ needs.build.outputs.preview_slug }}
      SITE_URL: ${{ needs.build.outputs.site_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: preview/${{ env.PREVIEW_SLUG }}
          # Never remove anything already on gh-pages: the production site lives
          # at the root of that branch, and previews of other branches live
          # alongside this one.
          keep_files: true
          commit_message: "docs preview for ${{ github.ref_name }} at ${{ github.sha }}"

      - name: Report the preview URL
        run: |
          echo "::notice title=Documentation preview::$SITE_URL"
          echo "[documentation preview]($SITE_URL)" >> "$GITHUB_STEP_SUMMARY"
