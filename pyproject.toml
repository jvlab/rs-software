[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-tools"
version = "0.1.0"
description = "Conversion and analysis utilities for representational similarity choice data"
readme = "README_pypi.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.0", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["rs_tools*"]
